<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Book | Zahra Azadeh</title>
  <meta name="description" content="Download the free book by Zahra Azadeh">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #1e293b;
    }

    .container {
      max-width: 920px;
      width: 100%;
      background: white;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.12);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 768px) {
      .container {
        flex-direction: row;
      }
    }

    .cover {
      flex: 1;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 30px;
    }

    .cover img {
      max-width: 100%;
      max-height: 460px;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      transition: transform 0.3s ease;
    }

    .cover img:hover {
      transform: scale(1.03);
    }

    .content {
      flex: 1;
      padding: 50px 45px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    h1 {
      font-size: 2.1rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: #0f172a;
      line-height: 1.3;
    }

    .author {
      font-size: 1.15rem;
      color: #64748b;
      margin-bottom: 28px;
    }

    .description {
      font-size: 1.08rem;
      line-height: 1.75;
      color: #475569;
      margin-bottom: 38px;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      text-decoration: none;
      padding: 16px 34px;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 10px 25px rgba(79, 70, 229, 0.3);
      width: fit-content;
    }

    .download-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(79, 70, 229, 0.4);
    }

    .download-btn svg {
      width: 22px;
      height: 22px;
    }

    .footer {
      margin-top: 32px;
      font-size: 0.95rem;
      color: #94a3b8;
    }

    @media (max-width: 767px) {
      .content {
        padding: 35px 28px;
        text-align: center;
      }

      .download-btn {
        margin: 0 auto;
      }

      h1 {
        font-size: 1.7rem;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- Book Cover -->
    <div class="cover">
      <img 
        src="assets/images/cover.png" 
        alt="The Vibration Principle Book Cover"
      >
    </div>

    <!-- Content -->
    <div class="content">

      <h1>The Vibration Principle</h1>

      <div class="author">
        by Zahra Azadeh
      </div>
      
      <div class="description">
        This book is freely available for everyone.
        I hope you find it useful and enjoyable.
      </div>

      <!-- Download Button -->
      <!-- 
        IMPORTANT:
        The PDF must be located at:

        downloads/
        └── The_Vibration_Principle_by_Z_Azadeh.pdf
      -->

      <a 
        href="./downloads/The_Vibration_Principle_by_Z_Azadeh.pdf"
        class="download-btn"
        download
      >
        <svg 
          xmlns="http://www.w3.org/2000/svg" 
          fill="none" 
          viewBox="0 0 24 24" 
          stroke="currentColor"
        >
          <path 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            stroke-width="2" 
            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" 
          />
        </svg>

        Download Free PDF
      </a>

      <div class="footer">
        Made with care by Zahra Azadeh
      </div>

    </div>

  </div>

</body>
</html>
